<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EP! Sync Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a; --surface: #111827; --surface2: #1a2235; --border: #1e2d45;
    --accent: #00c9a7; --accent2: #ff6b6b; --accent3: #ffd166; --text: #e2e8f0; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; }
  body::before { content:''; position:fixed; inset:0; background-image: linear-gradient(rgba(0,201,167,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,201,167,0.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
  .container { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:40px 24px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:40px; flex-wrap:wrap; gap:16px; }
  .logo-area h1 { font-size:2rem; font-weight:800; letter-spacing:-0.03em; line-height:1; }
  .logo-area h1 span { color:var(--accent); }
  .logo-area p { font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--muted); margin-top:6px; }
  .search-bar { display:flex; gap:10px; flex:1; max-width:500px; }
  .search-bar input { flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 16px; font-family:'JetBrains Mono',monospace; font-size:0.85rem; outline:none; transition:border-color 0.2s; }
  .search-bar input:focus { border-color:var(--accent); }
  .search-bar input::placeholder { color:var(--muted); }
  .btn { background:var(--accent); color:#000; border:none; padding:10px 20px; font-family:'Syne',sans-serif; font-weight:700; font-size:0.85rem; cursor:pointer; transition:opacity 0.2s,transform 0.1s; letter-spacing:0.05em; white-space:nowrap; }
  .btn:hover { opacity:0.85; } .btn:active { transform:scale(0.97); } .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .status-bar { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); padding:12px 16px; font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--muted); margin-bottom:24px; display:flex; align-items:flex-start; gap:10px; min-height:44px; }
  .status-bar .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; margin-top:4px; }
  .status-bar.loading { border-left-color:var(--accent3); } .status-bar.loading .dot { background:var(--accent3); animation:pulse 1s infinite; }
  .status-bar.success { border-left-color:var(--accent); } .status-bar.success .dot { background:var(--accent); }
  .status-bar.error { border-left-color:var(--accent2); } .status-bar.error .dot { background:var(--accent2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .log-lines { display:flex; flex-direction:column; gap:2px; }
  .log-line { opacity:0.6; } .log-line:last-child { opacity:1; color:var(--text); }
  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
  .card { background:var(--surface); border:1px solid var(--border); padding:16px; }
  .card .label { font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px; }
  .card .value { font-size:1.8rem; font-weight:800; line-height:1; }
  .card.match .value { color:var(--accent); } .card.mismatch .value { color:var(--accent2); } .card.missing .value { color:var(--accent3); } .card.total .value { color:var(--text); }
  .student-strip { background:var(--surface2); border:1px solid var(--border); padding:16px 20px; margin-bottom:20px; display:flex; gap:32px; flex-wrap:wrap; align-items:center; }
  .student-strip .field { display:flex; flex-direction:column; gap:2px; }
  .student-strip .field .key { font-family:'JetBrains Mono',monospace; font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
  .student-strip .field .val { font-size:0.9rem; font-weight:600; color:var(--accent); }
  .filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-btn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:5px 12px; font-family:'Syne',sans-serif; font-size:0.72rem; font-weight:600; cursor:pointer; letter-spacing:0.05em; transition:all 0.15s; }
  .filter-btn:hover,.filter-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(0,201,167,0.05); }
  .filter-btn.f-mismatch.active { border-color:var(--accent2); color:var(--accent2); background:rgba(255,107,107,0.05); }
  .filter-btn.f-missing.active { border-color:var(--accent3); color:var(--accent3); background:rgba(255,209,102,0.05); }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:0.82rem; }
  thead tr { background:var(--surface2); border-bottom:2px solid var(--accent); }
  thead th { padding:12px 14px; text-align:left; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; }
  thead th:first-child { color:var(--accent); }
  tbody tr { border-bottom:1px solid var(--border); transition:background 0.15s; } tbody tr:hover { background:var(--surface2); }
  tbody td { padding:10px 14px; font-family:'JetBrains Mono',monospace; font-size:0.75rem; vertical-align:middle; }
  td.field-name { color:var(--accent); font-size:0.72rem; } td.val-empty { color:var(--muted); font-style:italic; }
  .badge { display:inline-block; padding:2px 8px; font-size:0.65rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; font-family:'Syne',sans-serif; }
  .badge.match { background:rgba(0,201,167,0.15); color:var(--accent); } .badge.mismatch { background:rgba(255,107,107,0.15); color:var(--accent2); }
  .badge.missing { background:rgba(255,209,102,0.15); color:var(--accent3); } .badge.both-empty { background:rgba(100,116,139,0.2); color:var(--muted); }
  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .icon { font-size:3rem; margin-bottom:16px; }
  ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border)}
  @media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)} header{flex-direction:column;align-items:flex-start} .search-bar{max-width:100%;width:100%}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-area">
      <h1>EP! <span>Sync</span> Checker</h1>
      <p>EPme WordPress ↔ HubSpot · usermeta comparison</p>
    </div>
    <div class="search-bar">
      <input type="text" id="emailInput" placeholder="student email address..." />
      <button class="btn" id="searchBtn" onclick="runSearch()">CHECK</button>
    </div>
  </header>

  <div class="status-bar" id="statusBar">
    <div class="dot"></div>
    <div class="log-lines" id="logLines"><div class="log-line">Enter a student email address to compare EPme and HubSpot data.</div></div>
  </div>

  <div id="summaryArea" style="display:none">
    <div class="summary">
      <div class="card total"><div class="label">Fields Checked</div><div class="value" id="totalCount">—</div></div>
      <div class="card match"><div class="label">Matching</div><div class="value" id="matchCount">—</div></div>
      <div class="card mismatch"><div class="label">Mismatches</div><div class="value" id="mismatchCount">—</div></div>
      <div class="card missing"><div class="label">Missing Data</div><div class="value" id="missingCount">—</div></div>
    </div>
    <div class="student-strip" id="studentStrip"></div>
  </div>

  <div id="resultsArea" style="display:none">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn f-mismatch" onclick="setFilter('mismatch',this)">Mismatches only</button>
      <button class="filter-btn f-missing" onclick="setFilter('missing',this)">Missing only</button>
      <button class="filter-btn" onclick="setFilter('match',this)">Matches only</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Field</th><th>EPme (WordPress)</th><th>HubSpot</th><th>Status</th></tr></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

  <div id="emptyState" class="empty-state" style="display:none">
    <div class="icon">⚠️</div>
    <p id="emptyMsg"></p>
  </div>
</div>

<script>
const WP_AUTH_B64 = btoa('claude.bot:jBib hCpY 8RvW QPpc od53 ZUyF');

const USERMETA_FIELDS = [
  'usermeta_school','usermeta_class','usermeta_course','usermeta_teacher',
  'usermeta_birth_month','usermeta_dateofbirth','usermeta_familynamekanji',
  'usermeta_firstnamekanji','usermeta_has_sibling','usermeta_eldest_sibling',
  'usermeta_second_sibling','usermeta_third_sibling','usermeta_nenbarai',
  'usermeta_madoguchi','usermeta_madoguchi_kh','usermeta_madoguchi_tw','usermeta_madoguchi_kz',
  'usermeta_email_for_emergencies_ok','usermeta_email_for_notifications_ok',
  'usermeta_email_for_news_ok','usermeta_email_for_promo_ok',
  'usermeta_sms_for_emergencies_ok','usermeta_sms_for_notifications_ok','usermeta_sms_for_promo_ok',
  'usermeta_photogalleries_ok','usermeta_photos_on_web_ok','usermeta_photos_on_sns_ok',
  'usermeta_photos_on_printads_ok','usermeta_specialneeds_yesno','usermeta_specialneeds_details',
  'usermeta_forwarding_email','usermeta_real_email'
];

let allRows = [], currentFilter = 'all', logLines = [];

function log(msg) {
  logLines.push(msg);
  document.getElementById('logLines').innerHTML = logLines.map(l=>`<div class="log-line">${l}</div>`).join('');
}
function setStatus(t) { document.getElementById('statusBar').className = 'status-bar'+(t?' '+t:''); }
function norm(v) { if(v===null||v===undefined||v===false) return ''; return String(v).trim(); }

function setFilter(f,btn) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('resultsBody');
  const rows = currentFilter==='all' ? allRows
    : currentFilter==='mismatch' ? allRows.filter(r=>r.status==='mismatch')
    : currentFilter==='missing'  ? allRows.filter(r=>r.status==='missing-wp'||r.status==='missing-hs')
    : allRows.filter(r=>r.status==='match');
  if(!rows.length){ tbody.innerHTML=`<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.75rem;">No rows match this filter.</td></tr>`; return; }
  tbody.innerHTML = rows.map(r=>{
    const wpC=r.wp?'':'val-empty', hsC=r.hs?'':'val-empty';
    const badge = r.status==='match' ? '<span class="badge match">✓ Match</span>'
      : r.status==='mismatch' ? '<span class="badge mismatch">✗ Mismatch</span>'
      : r.status==='missing-wp'||r.status==='missing-hs' ? '<span class="badge missing">Missing</span>'
      : '<span class="badge both-empty">Both empty</span>';
    return `<tr><td class="field-name">${r.field}</td><td class="${wpC}">${r.wp||'—'}</td><td class="${hsC}">${r.hs||'—'}</td><td>${badge}</td></tr>`;
  }).join('');
}

async function callClaude(system, user, mcpServers=[]) {
  const body = { model:'claude-sonnet-4-20250514', max_tokens:4000, system, messages:[{role:'user',content:user}] };
  if(mcpServers.length) body.mcp_servers = mcpServers;
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error(`API error ${res.status}: ${await res.text()}`);
  return res.json();
}

function extractJSON(data) {
  const text = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  const clean = text.replace(/```json|```/g,'').trim();
  try { return JSON.parse(clean); } catch {
    const m = clean.match(/\{[\s\S]*\}/);
    if(m) return JSON.parse(m[0]);
    throw new Error('Could not parse response. Raw: '+clean.slice(0,500));
  }
}

async function runSearch() {
  const email = document.getElementById('emailInput').value.trim();
  if(!email){ setStatus('error'); log('Please enter an email address.'); return; }
  document.getElementById('searchBtn').disabled=true;
  document.getElementById('summaryArea').style.display='none';
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('emptyState').style.display='none';
  allRows=[]; logLines=[];

  try {
    setStatus('loading');
    log('Connecting to EPme (WordPress)...');

    const wpResult = extractJSON(await callClaude(
      `You fetch data from the WordPress REST API at https://english-please.me using HTTP Basic auth (Authorization: Basic ${WP_AUTH_B64}). Return ONLY a JSON object, no markdown, in this exact shape: {"found":true,"wp_id":0,"wp_name":"","wp_first_name":"","wp_last_name":"","meta":{}} or {"found":false}. The meta object should contain all usermeta_ prefixed fields you find.`,
      `1. GET https://english-please.me/wp-json/wp/v2/users?search=${encodeURIComponent(email)}&context=edit with header Authorization: Basic ${WP_AUTH_B64}
2. If a user is found, GET https://english-please.me/wp-json/wp/v2/users/{id}?context=edit with the same auth header.
3. Return their id, name, first_name, last_name, and all meta fields (especially any starting with usermeta_) as a JSON object in the format specified.`
    ));

    if(!wpResult.found) {
      setStatus('error'); log('No EPme user found with that email.');
      document.getElementById('emptyState').style.display='block';
      document.getElementById('emptyMsg').textContent='No student found in EPme with that email address.';
      document.getElementById('searchBtn').disabled=false; return;
    }
    log(`✓ EPme user found: ${wpResult.wp_first_name} ${wpResult.wp_last_name} (ID: ${wpResult.wp_id})`);

    log('Connecting to HubSpot...');
    const hsResult = extractJSON(await callClaude(
      `You are a HubSpot CRM assistant. Return ONLY a JSON object, no markdown. Format: {"found":true,"hs_id":"","properties":{}} or {"found":false}. Include all requested properties in the properties object.`,
      `Search HubSpot for contact with email "${email}". Return these properties: firstname, lastname, lifecyclestage, crm_student_learnertype, ${USERMETA_FIELDS.join(', ')}.`,
      [{type:'url',url:'https://mcp.hubspot.com/anthropic',name:'hubspot-mcp'}]
    ));

    if(!hsResult.found) {
      setStatus('error'); log(`✓ EPme found but no HubSpot contact for ${email}.`);
      document.getElementById('emptyState').style.display='block';
      document.getElementById('emptyMsg').textContent='Student found in EPme but not in HubSpot.';
      document.getElementById('searchBtn').disabled=false; return;
    }
    log(`✓ HubSpot contact found (ID: ${hsResult.hs_id})`);
    log('Comparing fields...');

    const wpMeta=wpResult.meta||{}, hsProps=hsResult.properties||{};
    let matchC=0, mismatchC=0, missingC=0;

    allRows = USERMETA_FIELDS.map(field=>{
      const wpVal=norm(wpMeta[field]), hsVal=norm(hsProps[field]);
      let status = !wpVal&&!hsVal ? 'both-empty' : !wpVal ? 'missing-wp' : !hsVal ? 'missing-hs' : wpVal===hsVal ? 'match' : 'mismatch';
      if(status==='match') matchC++;
      else if(status==='mismatch') mismatchC++;
      else if(status==='missing-wp'||status==='missing-hs') missingC++;
      return {field,wp:wpVal,hs:hsVal,status};
    });

    const total = allRows.filter(r=>r.status!=='both-empty').length;
    document.getElementById('totalCount').textContent=total;
    document.getElementById('matchCount').textContent=matchC;
    document.getElementById('mismatchCount').textContent=mismatchC;
    document.getElementById('missingCount').textContent=missingC;

    const name=[wpResult.wp_first_name,wpResult.wp_last_name].filter(Boolean).join(' ')||'—';
    const school=norm(wpMeta.usermeta_school)||norm(hsProps.usermeta_school)||'—';
    document.getElementById('studentStrip').innerHTML=`
      <div class="field"><span class="key">Name</span><span class="val">${name}</span></div>
      <div class="field"><span class="key">Email</span><span class="val">${email}</span></div>
      <div class="field"><span class="key">School</span><span class="val">${school}</span></div>
      <div class="field"><span class="key">Type</span><span class="val">${norm(hsProps.crm_student_learnertype)||'—'}</span></div>
      <div class="field"><span class="key">Stage</span><span class="val">${norm(hsProps.lifecyclestage)||'—'}</span></div>
      <div class="field"><span class="key">WP ID</span><span class="val">#${wpResult.wp_id}</span></div>
      <div class="field"><span class="key">HS ID</span><span class="val">#${hsResult.hs_id}</span></div>
    `;

    document.getElementById('summaryArea').style.display='block';
    document.getElementById('resultsArea').style.display='block';
    renderTable();
    log(mismatchC>0 ? `⚠ ${mismatchC} mismatch${mismatchC!==1?'es':''} and ${missingC} missing value${missingC!==1?'s':''} found.` : `✓ All ${matchC} populated fields match!`);
    setStatus(mismatchC>0?'error':'success');

  } catch(err) {
    setStatus('error'); log('Error: '+err.message);
    document.getElementById('emptyState').style.display='block';
    document.getElementById('emptyMsg').textContent=err.message;
  }
  document.getElementById('searchBtn').disabled=false;
}

document.getElementById('emailInput').addEventListener('keydown',e=>{ if(e.key==='Enter') runSearch(); });
</script>
</body>
</html>
